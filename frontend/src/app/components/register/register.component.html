<div class="register-container" style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
  <h2>Registro de Cliente - J3 Motors</h2>
  <form (ngSubmit)="onRegister()">
    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px;">Nombre Completo:</label>
      <input type="text" name="nombreCompleto" [(ngModel)]="registerData.nombreCompleto" required style="width: 100%; padding: 8px; box-sizing: border-box;">
    </div>
    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px;">Correo Electrónico:</label>
      <input type="email" name="email" [(ngModel)]="registerData.email" required style="width: 100%; padding: 8px; box-sizing: border-box;">
    </div>
    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px;">Usuario:</label>
      <input type="text" name="username" [(ngModel)]="registerData.username" required style="width: 100%; padding: 8px; box-sizing: border-box;">
    </div>
    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px;">Contraseña:</label>
      <input type="password" name="password" [(ngModel)]="registerData.password" required style="width: 100%; padding: 8px; box-sizing: border-box;">
    </div>
    
    <p *ngIf="errorMessage" style="color: red; font-size: 14px;">{{ errorMessage }}</p>
    <p *ngIf="successMessage" style="color: green; font-size: 14px;">{{ successMessage }}</p>
    
    <button type="submit" style="width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Registrarse
    </button>
  </form>
</div>
