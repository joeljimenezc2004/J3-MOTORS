<div class="login-container" style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
  <h2>Iniciar Sesión - J3 Motors</h2>
  <form (ngSubmit)="onLogin()">
    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px;">Usuario:</label>
      <input type="text" name="username" [(ngModel)]="loginData.username" required style="width: 100%; padding: 8px; box-sizing: border-box;">
    </div>
    <div style="margin-bottom: 15px;">
      <label style="display: block; margin-bottom: 5px;">Contraseña:</label>
      <input type="password" name="password" [(ngModel)]="loginData.password" required style="width: 100%; padding: 8px; box-sizing: border-box;">
    </div>
    <p *ngIf="errorMessage" style="color: red; font-size: 14px;">{{ errorMessage }}</p>
    <button type="submit" style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
      Ingresar
    </button>
  </form>
</div>
