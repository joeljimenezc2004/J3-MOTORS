<nav class="navbar" style="display: flex; justify-content: space-between; padding: 15px; background-color: #1a1a1a; color: white; align-items: center;">
  
  <!-- Enlaces izquierdos del Taller -->
  <div class="nav-links" style="display: flex; gap: 20px;">
    <a routerLink="/inicio" style="color: white; text-decoration: none; font-weight: bold;">J3 Motors</a>
    <a routerLink="/inicio" fragment="servicios" style="color: #ccc; text-decoration: none;">Servicios</a>
    <a routerLink="/inicio" fragment="repuestos" style="color: #ccc; text-decoration: none;">Repuestos</a>
  </div>

  <!-- Enlaces derechos de la Cuenta de Usuario -->
  <div class="auth-buttons" style="display: flex; gap: 15px; align-items: center;">
    
    <!-- 1. VISTA ANÓNIMA: Se muestra si NO ha iniciado sesión -->
    <ng-container *ngIf="!isLogged">
      <button routerLink="/login" style="padding: 8px 16px; background: transparent; color: white; border: 1px solid white; border-radius: 4px; cursor: pointer;">
        Iniciar Sesión
      </button>
      <button routerLink="/register" style="padding: 8px 16px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer;">
        Registrarse
      </button>
    </ng-container>

    <!-- 2. VISTA LOGUEADA: Se muestra SI YA inició sesión -->
    <ng-container *ngIf="isLogged">
      <span style="font-weight: bold; color: #28a745;">Hola, {{ nombreUsuario }}</span>
      
      <!-- BOTÓN PROTEGIDO: Solo aparece en pantalla si el usuario inició sesión con cuenta de Administrador -->
<button *ngIf="esAdmin" routerLink="/admin" style="padding: 8px 16px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer;">
  Modificar Datos (Admin)
</button>


      <button (click)="onLogout()" style="padding: 8px 16px; background-color: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer;">
        Salir
      </button>
    </ng-container>

  </div>
</nav>
