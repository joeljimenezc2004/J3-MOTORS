server.port=8080
spring.application.name=j3motors-backend

# ===============================
# Configuración MySQL (Persistencia)
# ===============================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:j3motors_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# Hibernate / JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# Seguridad Web & JWT
# ===============================
app.jwt-secret=J3MotorsSecretKeyParaAutenticacionSeguraConTokenJwtEnElTaller2026Mecanica
app.jwt-expiration-ms=86400000

# ===============================
# Logs
# ===============================
logging.level.com.j3motors=DEBUG
logging.level.org.springframework.security=INFO
