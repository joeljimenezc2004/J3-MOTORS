spring.application.name=j3motors-backend-test

# ===============================
# Configuración H2 In-Memory (TDD / Pruebas)
# ===============================
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ===============================
# Seguridad Web & JWT para Tests
# ===============================
app.jwt-secret=TestSecretKeyParaAutenticacionSeguraConTokenJwtEnElTaller2026MecanicaSuperLong
app.jwt-expiration-ms=3600000

logging.level.com.j3motors=WARN
